spring:
  application:
    name: distributed-coupon-system
  datasource:
    url: jdbc:postgresql://localhost:5433/coupon_db
    username: postgres
    password: postgres

    jpa:
      show-sql: true
      properties:
        hibernate:
          format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"